<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Artasimn — Tattoo</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="header"></header>

<main class="product-page">
  <a class="back-link" href="tattoo.html">&lt; BACK TO TATTOOS</a>
  <div class="product" id="product"></div>
</main>

<footer class="footer"></footer>

<script src="js/data.js"></script>
<script src="js/site.js"></script>
<script>
  mountHeader();
  mountFooter();

  const id = new URLSearchParams(location.search).get('id');
  const item = SKETCHES.find((s) => s.id === id) || SKETCHES[0];
  document.title = 'Artasimn — ' + item.caption;

  const descriptionHtml =
    item.descriptionRu.map((p) => `<p>${p}</p>`).join('') +
    item.descriptionEn.map((p) => `<p>${p}</p>`).join('') +
    '<p style="color:#999;font-size:13px">*Социальная сеть Instagram запрещена на территории РФ, Meta Platforms Inc. признана в РФ экстремистской организацией.</p>';

  document.getElementById('product').innerHTML = `
    <div class="product__left">
      <div class="product__main">
        <img src="${item.image}" alt="${item.caption}">
      </div>
      <div class="product__title">ЭСКИЗ</div>
      <div class="product__price">${item.date}</div>
    </div>
    <div class="product__right">
      <div class="product__actions">
        <a href="https://t.me/artasimn" target="_blank" rel="noopener">+ order via telegram</a>
        <a href="https://instagram.com/artasimn" target="_blank" rel="noopener">+ order via instagram</a>
      </div>
      ${accordionMarkup('DESCRIPTION', descriptionHtml, true)}
    </div>`;

  initAccordions();
</script>
</body>
</html>
