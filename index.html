<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Artasimn</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="header"></header>

<nav class="menu-strip" id="menuStrip"></nav>
<div class="hero-mobile" id="heroMobile"></div>

<main class="catalogue" id="catalogue">
  <div class="grid-2" data-grid></div>
</main>

<footer class="footer"></footer>

<script src="js/data.js"></script>
<script src="js/site.js"></script>
<script>
  const cat = new URLSearchParams(location.search).get('cat');
  const validCat = cat === 'jewellery' || cat === 'garment' ? cat : null;

  mountHeader();
  mountFooter();

  if (validCat) {
    // a category was picked from the photo-menu (or the items mega-menu)
    // — the 4-tile grid has done its job, so it goes away. On mobile the
    // single-photo hero sticks around, now showing that category's own
    // tile photo with a small label instead of the wordmark, so there's
    // still a "section title" screen before the catalogue grid. Desktop
    // has no hero here at all — matches items.html: no photo to float
    // over, permanently transparent, catalogue gets the header-clearance
    // padding instead.
    document.getElementById('menuStrip').remove();
    const menuEntry = MENU.find((m) => m.id === validCat);
    mountHeroMobile('', menuEntry.image, menuEntry.label.toLowerCase());
    if (window.innerWidth <= 980) {
      initHeroHeader();
    } else {
      document.getElementById('catalogue').classList.add('catalogue--top');
      document.querySelector('.header').classList.add('is-transparent');
    }
  } else {
    mountMenuStrip('', validCat);
    mountHeroMobile('');
    initHeroHeader();
  }

  const items = validCat ? byCat(validCat) : PRODUCTS;
  renderCards('[data-grid]', items);

  if (!validCat) {
    document.querySelector('[data-grid]').insertAdjacentHTML('beforeend', sketchCardMarkup());
  }
</script>
</body>
</html>
