<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Artasimn</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="stylesheet" href="css/style.css?v=20260820">
</head>
<body>

<header class="header"></header>

<nav class="menu-strip" id="menuStrip"></nav>
<div class="hero-mobile" id="heroMobile"></div>

<div class="catalogue__heading" id="catalogueHeading">recommended:</div>

<main class="catalogue" id="catalogue">
  <div class="grid-2" data-grid></div>
</main>

<footer class="footer"></footer>

<script src="js/data.js?v=20260820"></script>
<script src="js/site.js?v=20260820"></script>
<script>
  const cat = new URLSearchParams(location.search).get('cat');
  const validCat = cat === 'jewellery' || cat === 'garment' ? cat : null;

  mountHeader();
  mountFooter();

  if (validCat) {
    // a category was picked from the photo-menu (or the items mega-menu)
    // — the 4-tile grid and the big mobile intro photo have both done
    // their job, so they go away entirely; the page behaves exactly
    // like items.html from here, permanently transparent header and no
    // hero on any viewport width.
    document.getElementById('menuStrip').remove();
    document.getElementById('heroMobile').remove();
    document.getElementById('catalogueHeading').remove();
    document.getElementById('catalogue').classList.add('catalogue--top');
    document.querySelector('.header').classList.add('is-transparent');
  } else {
    mountMenuStrip('', validCat);
    mountHeroMobile('');
  }
  initHeroHeader();

  const items = validCat ? byCat(validCat) : PRODUCTS;
  renderCards('[data-grid]', items);

  if (!validCat) {
    document.querySelector('[data-grid]').insertAdjacentHTML('beforeend', sketchCardMarkup());
  }
</script>
</body>
</html>
