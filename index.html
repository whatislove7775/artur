<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Artasimn</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="header"></header>

<nav class="menu-strip" id="menuStrip"></nav>
<div class="hero-mobile" id="heroMobile"></div>

<main class="catalogue" id="catalogue">
  <div class="grid-2" data-grid></div>
</main>

<footer class="footer"></footer>

<script src="js/data.js"></script>
<script src="js/site.js"></script>
<script>
  const cat = new URLSearchParams(location.search).get('cat');
  const validCat = cat === 'jewellery' || cat === 'garment' ? cat : null;

  mountHeader();
  mountFooter();

  if (validCat) {
    // a category was picked from the photo-menu (or the items mega-menu)
    // — the 4-tile grid has done its job, so it goes away. On mobile the
    // single-photo hero sticks around, now showing that category's own
    // tile photo with a small label instead of the wordmark, so there's
    // still a "section title" screen before the catalogue grid.
    // is-transparent is set unconditionally here (not just on desktop):
    // on mobile, initHeroHeader's own scroll handling immediately
    // overrides it with the real state anyway, so there's no window of
    // wrong width-dependent behaviour to race against; on desktop
    // there's no hero for initHeroHeader to touch it with at all, so it
    // just sticks — permanently transparent, matching items.html.
    // catalogue--top-desktop gives it the matching header-clearance
    // padding there (a no-op on mobile, where the hero itself already
    // pushes the catalogue down).
    document.getElementById('menuStrip').remove();
    const menuEntry = MENU.find((m) => m.id === validCat) || MENU[0];
    mountHeroMobile('', menuEntry.image, menuEntry.label);
    document.getElementById('catalogue').classList.add('catalogue--top-desktop');
    document.querySelector('.header').classList.add('is-transparent');
  } else {
    mountMenuStrip('', validCat);
    mountHeroMobile('');
  }
  initHeroHeader();

  const items = validCat ? byCat(validCat) : PRODUCTS;
  renderCards('[data-grid]', items);

  if (!validCat) {
    document.querySelector('[data-grid]').insertAdjacentHTML('beforeend', sketchCardMarkup());
  }
</script>
</body>
</html>
