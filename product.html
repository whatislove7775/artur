<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Artasimn — Item</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="stylesheet" href="css/style.css?v=20260837">
</head>
<body>

<header class="header"></header>

<main class="product-page">
  <div class="product" id="product"></div>
</main>

<footer class="footer"></footer>

<script src="js/data.js?v=20260837"></script>
<script src="js/site.js?v=20260837"></script>
<script>
  const id = new URLSearchParams(location.search).get('id');
  const adeptItem = ADEPT_PRODUCTS.find((p) => p.id === id);
  const item = adeptItem || PRODUCTS.find((p) => p.id === id) || PRODUCTS[0];
  document.title = 'Artasimn — ' + item.title;

  // a.dept's own products reuse this exact same page/layout, just with
  // the dark theme and a.dept's own header instead of a second,
  // near-duplicate template
  if (adeptItem) {
    document.body.classList.add('dark-theme');
    document.querySelector('link[rel="icon"]').href = 'assets/adept/favicon-adept.svg';
    mountAdeptHeader();
    mountFooter('artasimn.department');
  } else {
    mountHeader();
    mountFooter();
  }

  const dots =
    item.images.length > 1
      ? `<div class="product__dots">${item.images
          .map((_, i) => `<span${i === 0 ? ' class="is-active"' : ''} data-i="${i}"></span>`)
          .join('')}</div>`
      : '';

  const sizeMarkup =
    item.sizes && item.sizes.length
      ? `<div class="product__sizes" data-sizes>
          ${item.sizes
            .map(
              (s, i) =>
                `<button type="button" class="product__size${i === 0 ? ' is-active' : ''}" data-size="${s}">${s}</button>`
            )
            .join('')}
        </div>`
      : `<div class="product__note">one size</div>`;

  document.getElementById('product').innerHTML = `
    <div class="product__left">
      <div class="product__main">
        <img id="mainImg" src="${item.images[0]}" alt="${item.title}">
      </div>
      ${dots}
      <h1 class="product__title">${item.title}</h1>
      <div class="product__price">
        ${item.oldPrice ? `<span class="product__price-old">${item.oldPrice}</span>` : ''}${item.price}
      </div>
    </div>
    <div class="product__right">
      <div class="product__thumbs">
        ${item.images
          .map(
            (src, i) =>
              `<div class="thumb${i === 0 ? ' is-active' : ''}" data-src="${src}">
                 <img src="${src}" alt="">
               </div>`
          )
          .join('')}
      </div>
      <div class="product__actions">
        <a href="#" data-add-to-card>+ to cart</a>
      </div>
      ${sizeMarkup}
      ${accordionMarkup(
        'DESCRIPTION',
        `<p>${item.material}</p>`,
        true
      )}
      ${accordionMarkup(
        'DELIVERY',
        '<p>Курьером по Москве — 1-2 дня. Почтой по России — 3-7 дней. Стоимость и сроки уточняются при оформлении заказа.</p>',
        false
      )}
    </div>`;

  const main = document.getElementById('mainImg');
  const dotEls = document.querySelectorAll('.product__dots span');
  let currentIndex = 0;
  const setImage = (i, src) => {
    currentIndex = i;
    main.src = src;
    document.querySelectorAll('.thumb').forEach((t, idx) => t.classList.toggle('is-active', idx === i));
    dotEls.forEach((d, idx) => d.classList.toggle('is-active', idx === i));
  };
  document.querySelectorAll('.thumb').forEach((t, i) => {
    t.addEventListener('click', () => setImage(i, t.dataset.src));
  });
  dotEls.forEach((d, i) => {
    d.addEventListener('click', () => setImage(i, item.images[i]));
  });

  // hovering the main photo scrubs through the gallery by cursor
  // position, same as the product cards on the home page
  if (item.images.length > 1) {
    const mainFrame = document.querySelector('.product__main');
    mainFrame.addEventListener('mousemove', (e) => {
      const rect = mainFrame.getBoundingClientRect();
      const fraction = (e.clientX - rect.left) / rect.width;
      const i = Math.min(item.images.length - 1, Math.max(0, Math.floor(fraction * item.images.length)));
      setImage(i, item.images[i]);
    });
    mainFrame.addEventListener('mouseleave', () => setImage(0, item.images[0]));
  }

  document.querySelector('.product__main').addEventListener('click', () => {
    openLightbox(item.images, currentIndex, item.title);
  });

  // mobile: swipe or tap the left/right third to step through photos;
  // a tap on the centre third opens the lightbox (the click handler
  // above already covers mouse/desktop)
  attachTouchImageNav(
    document.querySelector('.product__main'),
    item.images.length,
    () => currentIndex,
    (i) => setImage(i, item.images[i]),
    () => openLightbox(item.images, currentIndex, item.title)
  );

  initAccordions();

  document.querySelectorAll('.product__size').forEach((btn) => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.product__size').forEach((b) => b.classList.remove('is-active'));
      btn.classList.add('is-active');
    });
  });

  document.querySelector('[data-add-to-card]').addEventListener('click', (e) => {
    e.preventDefault();
    addToCart(item.id, 1);
    openCartDrawer();
  });
</script>
</body>
</html>
