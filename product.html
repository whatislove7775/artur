<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Artasimn — Item</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="header"></header>

<main class="page">
  <div class="product" id="product"></div>
</main>

<script src="js/data.js"></script>
<script src="js/site.js"></script>
<script>
  mountHeader();

  const id = new URLSearchParams(location.search).get('id');
  const item = PRODUCTS.find((p) => p.id === id) || PRODUCTS[0];
  document.title = 'Artasimn — ' + item.title;

  const isGarment = item.cat === 'garment';

  document.getElementById('product').innerHTML = `
    <div class="product__left">
      <div class="product__main-img">
        <img id="mainImg" src="${item.front}" alt="${item.title}">
      </div>
      <h1 class="product__title">${item.title}</h1>
      <div class="product__price">${item.price}</div>
    </div>

    <div class="product__right">
      <div class="product__thumbs">
        ${item.gallery
          .map(
            (src) =>
              `<div class="thumb" data-src="${src}">
                 <img src="${src}" alt="">
               </div>`
          )
          .join('')}
      </div>

      <div class="product__desc">
        <p>${isGarment ? GARMENT_DESC.intro : 'artasimn department jewelry [ a.dept ]'}</p>
        <ul>${item.specs.map((s) => `<li>${s}</li>`).join('')}</ul>
        <p>${GARMENT_DESC.community}</p>
        <p class="note">${GARMENT_DESC.note}</p>
      </div>

      <div class="product__actions">
        <button class="btn" type="button">ORDER</button>
        <button class="btn" type="button">+ADD TO CARD</button>
      </div>
    </div>`;

  /* thumbnails swap the main image; the packshot stays first in line */
  const main = document.getElementById('mainImg');
  document.querySelectorAll('.thumb').forEach((t) => {
    t.addEventListener('click', () => {
      document.querySelectorAll('.thumb').forEach((x) => x.classList.remove('is-active'));
      t.classList.add('is-active');
      main.src = t.dataset.src;
    });
  });
</script>
</body>
</html>
