<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Artasimn — Tattoo</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="stylesheet" href="css/style.css?v=20260857">
</head>
<body>

<header class="header"></header>

<div class="hero-mobile" id="heroMobile"></div>

<nav class="year-tabs" data-year-tabs></nav>

<main class="catalogue" id="catalogue">
  <div class="year-pager" data-year-pager></div>
  <div class="sketch-grid" data-grid></div>
</main>

<aside class="year-rail" data-years></aside>

<footer class="footer"></footer>

<script src="js/data.js?v=20260857"></script>
<script src="js/site.js?v=20260857"></script>
<script>
  mountHeader();
  mountFooter();

  const years = sketchYears();
  const isMobile = window.innerWidth <= 980;

  if (isMobile) {
    // half-screen intro photo with the section name over it, like the
    // homepage hero but shorter — same scroll-driven header behaviour
    // (initHeroHeader), just a text label instead of the wordmark image
    mountHeroMobile('', { img: 'assets/menu/tattoo.png', label: 'Tattoo' });
    document.getElementById('heroMobile').classList.add('hero-mobile--half');
    initHeroHeader();
    document.querySelector('[data-grid]').remove();

    // oldest-to-newest, left-to-right — matches how the tabs read, and
    // how the pager pages are laid out below
    const yearsAsc = [...years].reverse();
    const tabs = document.querySelector('[data-year-tabs]');
    const pager = document.querySelector('[data-year-pager]');

    tabs.innerHTML = yearsAsc
      .map((y) => `<button type="button" class="year-tabs__item" data-year="${y}">${y}</button>`)
      .join('');
    pager.innerHTML = yearsAsc
      .map(
        (y) =>
          `<div class="year-page" data-year-page="${y}">
             <div class="sketch-grid">
               ${byYear(y)
                 .map((s, i) => sketchCardMarkup('', s, i + 1))
                 .join('')}
             </div>
           </div>`
      )
      .join('');

    function setActive(year) {
      tabs.querySelectorAll('.year-tabs__item').forEach((btn) => {
        btn.classList.toggle('is-active', Number(btn.dataset.year) === year);
      });
      const active = tabs.querySelector('.year-tabs__item.is-active');
      if (active) active.scrollIntoView({ inline: 'center', block: 'nearest' });
    }

    // tapping a tab scrolls the pager to that year's page — the pager's
    // own scroll (see below) is what then confirms the selection and
    // keeps the tab centred, same as a manual swipe would
    tabs.querySelectorAll('.year-tabs__item').forEach((btn) => {
      btn.addEventListener('click', () => {
        const page = pager.querySelector(`[data-year-page="${btn.dataset.year}"]`);
        page.scrollIntoView({ inline: 'center', block: 'nearest', behavior: 'smooth' });
      });
    });

    // swiping the catalogue itself is the primary way to change year —
    // scroll-snap already makes each page settle centred; this just
    // figures out which page that is and syncs the tab strip to match
    let scrollTimer;
    pager.addEventListener(
      'scroll',
      () => {
        clearTimeout(scrollTimer);
        scrollTimer = setTimeout(() => {
          const index = Math.round(pager.scrollLeft / pager.clientWidth);
          setActive(yearsAsc[Math.max(0, Math.min(yearsAsc.length - 1, index))]);
        }, 100);
      },
      { passive: true }
    );

    // start on the newest year (the last page) with no scroll animation
    const lastPage = pager.lastElementChild;
    if (lastPage) pager.scrollLeft = lastPage.offsetLeft;
    setActive(yearsAsc[yearsAsc.length - 1]);
  } else {
    // desktop: unchanged — permanently transparent header, no hero, the
    // whole catalogue (every year) in one scroll with the year-rail
    // scrollspy on the right
    document.getElementById('heroMobile').remove();
    document.querySelector('[data-year-tabs]').remove();
    document.querySelector('[data-year-pager]').remove();
    document.getElementById('catalogue').classList.add('catalogue--top');
    document.querySelector('.header').classList.add('is-transparent');

    const grid = document.querySelector('[data-grid]');
    grid.classList.remove('sketch-grid');
    grid.classList.add('grid-2');

    // a plain 2-column grid, same as the product catalogue — every
    // card's frame is a fixed square ratio (see .sketch-card__frame
    // below), so rows line up cleanly instead of the staggered heights
    // a natural-aspect masonry gives. Built as real DOM nodes (not one
    // innerHTML string) so each can be tagged with its year for
    // initYearScrollspy to read
    years.forEach((year) => {
      byYear(year).forEach((s) => {
        const wrap = document.createElement('div');
        wrap.innerHTML = sketchCardMarkup('', s);
        const card = wrap.firstElementChild;
        card.dataset.year = year;
        grid.appendChild(card);
      });
    });

    const rail = document.querySelector('[data-years]');
    rail.innerHTML = years.map((y) => `<span class="year-rail__item">${y}</span>`).join('');
    initYearScrollspy(years);
  }
</script>
</body>
</html>
