<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Artasimn — Tattoo</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="header"></header>

<div class="hero-mobile" id="heroMobile"></div>

<main class="catalogue" id="catalogue">
  <div class="grid-2" data-grid></div>
</main>

<aside class="year-rail" data-years></aside>

<footer class="footer"></footer>

<script src="js/data.js"></script>
<script src="js/site.js"></script>
<script>
  mountHeader();
  mountFooter();

  // mobile/tablet gets the same single-photo "section title" screen as
  // a filtered category on index.html; desktop has no hero here (never
  // did), so it keeps the old permanent header-clearance padding.
  const tattooMenuEntry = MENU.find((m) => m.id === 'tattoo');
  mountHeroMobile('', tattooMenuEntry.image, tattooMenuEntry.label.toLowerCase());
  if (window.innerWidth <= 980) {
    initHeroHeader();
  } else {
    document.getElementById('catalogue').classList.add('catalogue--top');
  }

  const years = sketchYears();
  const grid = document.querySelector('[data-grid]');
  grid.innerHTML = years
    .map(
      (year, i) =>
        `<div class="year-marker" data-year-marker="${year}"></div>` +
        byYear(year)
          .map((s) => sketchCardMarkup('', s))
          .join('')
    )
    .join('');

  const rail = document.querySelector('[data-years]');
  rail.innerHTML = years.map((y) => `<span class="year-rail__item">${y}</span>`).join('');

  initYearScrollspy(years);
</script>
</body>
</html>
