<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Artasimn — Tattoo</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="stylesheet" href="css/style.css?v=20260813">
</head>
<body>

<header class="header"></header>

<div class="hero-mobile" id="heroMobile"></div>

<main class="catalogue" id="catalogue">
  <div class="grid-2" data-grid></div>
</main>

<aside class="year-rail" data-years></aside>

<footer class="footer"></footer>

<script src="js/data.js?v=20260813"></script>
<script src="js/site.js?v=20260813"></script>
<script>
  mountHeader();
  mountFooter();

  // behaves like items.html on every viewport: permanently transparent
  // header, no hero/intro photo, catalogue--top gives it the header
  // clearance padding on both desktop and mobile.
  document.getElementById('heroMobile').remove();
  document.getElementById('catalogue').classList.add('catalogue--top');
  document.querySelector('.header').classList.add('is-transparent');

  const years = sketchYears();
  const grid = document.querySelector('[data-grid]');
  grid.innerHTML = years
    .map(
      (year, i) =>
        `<div class="year-marker" data-year-marker="${year}"></div>` +
        byYear(year)
          .map((s) => sketchCardMarkup('', s))
          .join('')
    )
    .join('');

  const rail = document.querySelector('[data-years]');
  rail.innerHTML = years.map((y) => `<span class="year-rail__item">${y}</span>`).join('');

  initYearScrollspy(years);
</script>
</body>
</html>
